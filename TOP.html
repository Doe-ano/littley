<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP登陆少年</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #7B5EA7;
            --purple-light: #A894C8;
            --purple-pale: #E8E0F3;
            --yellow: #E8C547;
            --blue: #5B9BD5;
            --red: #D85C5C;
            --orange: #E8933A;
            --green: #6BB56E;
            --paper: #F5F0E8;
            --ink: #2C2420;
            --pencil-gray: #8A8279;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background-color: var(--paper);
            color: var(--ink);
            overflow-x: hidden;
            line-height: 1.8;
        }

        /* 纸张纹理 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 35px, rgba(139, 125, 107, 0.04) 35px, rgba(139, 125, 107, 0.04) 36px),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        /* 页面切换 */
        .page {
            min-height: 100vh;
            width: 100%;
            display: none;
            position: relative;
        }

        .page.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ==================== 开场页 ==================== */
        #intro-page {
            background: linear-gradient(160deg, #D4C4E8 0%, #B8A0D8 40%, #C8B8E0 70%, #D8D0F0 100%);
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 蝴蝶 SVG 装饰 */
        .butterfly-float {
            position: absolute;
            opacity: 0.35;
            animation: drift 8s ease-in-out infinite;
        }

        .butterfly-float svg {
            width: 60px;
            height: 60px;
            fill: none;
            stroke: var(--purple);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) rotate(-5deg); }
            25% { transform: translate(15px, -25px) rotate(5deg); }
            50% { transform: translate(-10px, -15px) rotate(-3deg); }
            75% { transform: translate(20px, -30px) rotate(8deg); }
        }

        .intro-content {
            text-align: center;
            z-index: 10;
            position: relative;
        }

        #typewriter-text {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--purple);
            letter-spacing: 0.15em;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        #typewriter-text .char {
            display: inline-block;
            opacity: 0;
            transform: translateY(12px) rotate(-3deg);
            animation: charReveal 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes charReveal {
            to {
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }
        }

        .enter-btn {
            margin-top: 50px;
            padding: 14px 45px;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.3rem;
            color: var(--purple);
            background: rgba(255, 255, 255, 0.25);
            border: 3px solid var(--purple);
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
            cursor: pointer;
            opacity: 0;
            animation: fadeInBtn 1s 2.5s forwards;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(4px);
            letter-spacing: 0.1em;
        }

        .enter-btn:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.08) rotate(-1deg);
            box-shadow: 0 8px 30px rgba(123, 94, 167, 0.25);
        }

        @keyframes fadeInBtn {
            to { opacity: 1; }
        }

        /* 底部蜡笔线条 */
        .crayon-stripe {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            max-width: 400px;
            height: 5px;
            background: repeating-linear-gradient(90deg, 
                var(--yellow) 0px, var(--yellow) 30px, 
                var(--blue) 30px, var(--blue) 60px, 
                var(--red) 60px, var(--red) 90px, 
                var(--orange) 90px, var(--orange) 120px, 
                var(--green) 120px, var(--green) 150px);
            border-radius: 3px;
            opacity: 0.5;
        }

        /* ==================== 主页面 ==================== */
        #main-page {
            padding-bottom: 60px;
        }

        /* 头部 */
        .site-header {
            width: 100%;
            text-align: center;
            padding: 40px 20px 20px;
            position: relative;
        }

        .site-header .butterfly-icon {
            position: absolute;
            top: 30px;
            opacity: 0.3;
        }

        .site-header .butterfly-icon svg {
            width: 45px;
            height: 45px;
            fill: none;
            stroke: var(--purple);
            stroke-width: 2;
            stroke-linecap: round;
        }

        .site-header .bf-left { left: 8%; animation: flutter 3s ease-in-out infinite; }
        .site-header .bf-right { right: 8%; animation: flutter 3s ease-in-out infinite 1.5s; }

        @keyframes flutter {
            0%, 100% { transform: scaleX(1) rotate(-8deg); }
            50% { transform: scaleX(0.6) rotate(8deg); }
        }

        .site-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(2.2rem, 6vw, 4rem);
            color: var(--purple);
            letter-spacing: 0.12em;
            display: inline-block;
            position: relative;
            transform: rotate(-1.5deg);
        }

        .site-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: -5%;
            width: 110%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--purple-light), transparent);
            border-radius: 2px;
            opacity: 0.6;
        }

        .site-subtitle {
            font-family: 'Noto Serif SC', serif;
            font-size: 1rem;
            color: var(--pencil-gray);
            margin-top: 15px;
            letter-spacing: 0.2em;
        }

        /* 导航 */
        .nav-bar {
            display: flex;
            gap: 12px;
            margin: 30px auto;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 20px;
        }

        .nav-item {
            padding: 10px 28px;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.15rem;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2.5px solid;
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
            position: relative;
            background: rgba(255,255,255,0.6);
            letter-spacing: 0.05em;
        }

        .nav-item:nth-child(1) { color: #9A7A00; border-color: var(--yellow); transform: rotate(-1.5deg); }
        .nav-item:nth-child(2) { color: #2E5A8C; border-color: var(--blue); transform: rotate(1deg); }
        .nav-item:nth-child(3) { color: #8C2E2E; border-color: var(--red); transform: rotate(-0.5deg); }
        .nav-item:nth-child(4) { color: #8C5A1A; border-color: var(--orange); transform: rotate(1.5deg); }
        .nav-item:nth-child(5) { color: #2E6E30; border-color: var(--green); transform: rotate(-1deg); }

        .nav-item:hover {
            transform: scale(1.1) rotate(0deg) !important;
            z-index: 10;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.08);
        }

        /* 分隔线 */
        .divider {
            width: 70%;
            max-width: 600px;
            height: 4px;
            margin: 10px auto;
            background: repeating-linear-gradient(90deg, 
                var(--yellow) 0px, var(--yellow) 25px, 
                var(--blue) 25px, var(--blue) 50px, 
                var(--red) 50px, var(--red) 75px, 
                var(--orange) 75px, var(--orange) 100px, 
                var(--green) 100px, var(--green) 125px);
            border-radius: 2px;
            opacity: 0.45;
        }

        /* 成员区 */
        .section {
            width: 100%;
            max-width: 1000px;
            padding: 30px 20px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .section-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.9rem;
            color: var(--purple);
            display: inline-block;
            padding: 6px 28px;
            border: 3px solid var(--purple-light);
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
            background: rgba(255,255,255,0.5);
            transform: rotate(-1deg);
            letter-spacing: 0.08em;
        }

        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 24px;
        }

        .member-card {
            background: white;
            border: 3px solid;
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
            padding: 28px 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .member-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(45deg, transparent, transparent 12px, rgba(0,0,0,0.015) 12px, rgba(0,0,0,0.015) 24px);
            pointer-events: none;
        }

        .member-card:hover {
            transform: translateY(-10px) rotate(1deg);
            box-shadow: 8px 8px 0 rgba(0,0,0,0.07);
        }

        .member-card:active {
            transform: scale(0.97);
        }

        .member-card:nth-child(1) { border-color: var(--yellow); }
        .member-card:nth-child(2) { border-color: var(--blue); }
        .member-card:nth-child(3) { border-color: var(--red); }
        .member-card:nth-child(4) { border-color: var(--orange); }
        .member-card:nth-child(5) { border-color: var(--green); }

        .member-avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 2rem;
            border: 3px solid;
            position: relative;
            z-index: 1;
        }

        .member-card:nth-child(1) .member-avatar { border-color: var(--yellow); background: #FFF9E0; color: #9A7A00; }
        .member-card:nth-child(2) .member-avatar { border-color: var(--blue); background: #E8F1FA; color: #2E5A8C; }
        .member-card:nth-child(3) .member-avatar { border-color: var(--red); background: #FAE8E8; color: #8C2E2E; }
        .member-card:nth-child(4) .member-avatar { border-color: var(--orange); background: #FAF0E0; color: #8C5A1A; }
        .member-card:nth-child(5) .member-avatar { border-color: var(--green); background: #E8F5E8; color: #2E6E30; }

        .member-name {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.4rem;
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
        }

        .member-role {
            font-size: 0.85rem;
            padding: 3px 14px;
            border-radius: 20px;
            display: inline-block;
            position: relative;
            z-index: 1;
            letter-spacing: 0.05em;
        }

        .member-card:nth-child(1) .member-role { background: #FFF9E0; color: #9A7A00; }
        .member-card:nth-child(2) .member-role { background: #E8F1FA; color: #2E5A8C; }
        .member-card:nth-child(3) .member-role { background: #FAE8E8; color: #8C2E2E; }
        .member-card:nth-child(4) .member-role { background: #FAF0E0; color: #8C5A1A; }
        .member-card:nth-child(5) .member-role { background: #E8F5E8; color: #2E6E30; }

        /* 模块占位区 */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 28px;
            margin-top: 10px;
        }

        .module-card {
            background: white;
            border: 3px solid var(--purple-light);
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
            padding: 28px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .module-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(-45deg, transparent, transparent 12px, rgba(123, 94, 167, 0.02) 12px, rgba(123, 94, 167, 0.02) 24px);
            pointer-events: none;
        }

        .module-card:hover {
            transform: rotate(-1deg) scale(1.02);
            box-shadow: 6px 6px 0 rgba(123, 94, 167, 0.1);
        }

        .module-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 14px;
            position: relative;
            z-index: 1;
        }

        .module-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--purple);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .module-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.35rem;
            color: var(--purple);
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
            letter-spacing: 0.05em;
        }

        .module-desc {
            font-size: 0.95rem;
            color: var(--pencil-gray);
            line-height: 1.7;
            position: relative;
            z-index: 1;
        }

        .module-tag {
            display: inline-block;
            margin-top: 14px;
            padding: 4px 16px;
            font-size: 0.8rem;
            color: var(--purple);
            background: var(--purple-pale);
            border: 2px dashed var(--purple-light);
            border-radius: 20px;
            position: relative;
            z-index: 1;
            font-family: 'Noto Serif SC', serif;
        }

        /* 页脚 */
        .site-footer {
            margin-top: 50px;
            padding: 30px 20px;
            text-align: center;
            width: 100%;
            position: relative;
        }

        .footer-butterflies {
            margin-bottom: 12px;
            opacity: 0.35;
        }

        .footer-butterflies svg {
            width: 32px;
            height: 32px;
            fill: none;
            stroke: var(--purple);
            stroke-width: 2;
            stroke-linecap: round;
            margin: 0 8px;
            animation: flutter 3s ease-in-out infinite;
        }

        .footer-butterflies svg:nth-child(2) { animation-delay: 0.6s; }
        .footer-butterflies svg:nth-child(3) { animation-delay: 1.2s; }
        .footer-butterflies svg:nth-child(4) { animation-delay: 1.8s; }
        .footer-butterflies svg:nth-child(5) { animation-delay: 2.4s; }

        .footer-text {
            font-size: 0.9rem;
            color: var(--pencil-gray);
            letter-spacing: 0.15em;
        }

        .footer-slogan {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.1rem;
            color: var(--purple-light);
            margin-top: 6px;
            letter-spacing: 0.1em;
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .members-grid { grid-template-columns: repeat(2, 1fr); }
            .nav-item { padding: 8px 20px; font-size: 1rem; }
            .module-card { padding: 22px; }
        }
    </style>
<base target="_blank">
</head>
<body>

<!-- ==================== 开场页 ==================== -->
<div id="intro-page" class="page active">
    <!-- 漂浮蝴蝶 -->
    <div class="butterfly-float" style="top:8%;left:12%;animation-delay:0s">
        <svg viewBox="0 0 60 60"><path d="M30 30 C20 20 10 10 15 5 C20 0 28 15 30 25 C32 15 40 0 45 5 C50 10 40 20 30 30 Z"/><path d="M30 30 C20 40 10 50 15 55 C20 60 28 45 30 35 C32 45 40 60 45 55 C50 50 40 40 30 30 Z"/><line x1="30" y1="25" x2="30" y2="35"/></svg>
    </div>
    <div class="butterfly-float" style="top:18%;right:15%;animation-delay:1.2s">
        <svg viewBox="0 0 60 60"><path d="M30 30 C20 20 10 10 15 5 C20 0 28 15 30 25 C32 15 40 0 45 5 C50 10 40 20 30 30 Z"/><path d="M30 30 C20 40 10 50 15 55 C20 60 28 45 30 35 C32 45 40 60 45 55 C50 50 40 40 30 30 Z"/><line x1="30" y1="25" x2="30" y2="35"/></svg>
    </div>
    <div class="butterfly-float" style="top:55%;left:18%;animation-delay:2.5s">
        <svg viewBox="0 0 60 60"><path d="M30 30 C20 20 10 10 15 5 C20 0 28 15 30 25 C32 15 40 0 45 5 C50 10 40 20 30 30 Z"/><path d="M30 30 C20 40 10 50 15 55 C20 60 28 45 30 35 C32 45 40 60 45 55 C50 50 40 40 30 30 Z"/><line x1="30" y1="25" x2="30" y2="35"/></svg>
    </div>
    <div class="butterfly-float" style="top:65%;right:12%;animation-delay:0.8s">
        <svg viewBox="0 0 60 60"><path d="M30 30 C20 20 10 10 15 5 C20 0 28 15 30 25 C32 15 40 0 45 5 C50 10 40 20 30 30 Z"/><path d="M30 30 C20 40 10 50 15 55 C20 60 28 45 30 35 C32 45 40 60 45 55 C50 50 40 40 30 30 Z"/><line x1="30" y1="25" x2="30" y2="35"/></svg>
    </div>
    <div class="butterfly-float" style="top:35%;left:78%;animation-delay:1.8s">
        <svg viewBox="0 0 60 60"><path d="M30 30 C20 20 10 10 15 5 C20 0 28 15 30 25 C32 15 40 0 45 5 C50 10 40 20 30 30 Z"/><path d="M30 30 C20 40 10 50 15 55 C20 60 28 45 30 35 C32 45 40 60 45 55 C50 50 40 40 30 30 Z"/><line x1="30" y1="25" x2="30" y2="35"/></svg>
    </div>

    <div class="intro-content">
        <div id="typewriter-text"></div>
        <button class="enter-btn" onclick="enterMain()">进 入</button>
    </div>

    <div class="crayon-stripe"></div>
</div>

<!-- ==================== 主页面 ==================== -->
<div id="main-page" class="page">
    <header class="site-header">
        <div class="butterfly-icon bf-left">
            <svg viewBox="0 0 60 60"><path d="M30 30 C20 20 10 10 15 5 C20 0 28 15 30 25 C32 15 40 0 45 5 C50 10 40 20 30 30 Z"/><path d="M30 30 C20 40 10 50 15 55 C20 60 28 45 30 35 C32 45 40 60 45 55 C50 50 40 40 30 30 Z"/><line x1="30" y1="25" x2="30" y2="35"/></svg>
        </div>
        <div class="butterfly-icon bf-right">
            <svg viewBox="0 0 60 60"><path d="M30 30 C20 20 10 10 15 5 C20 0 28 15 30 25 C32 15 40 0 45 5 C50 10 40 20 30 30 Z"/><path d="M30 30 C20 40 10 50 15 55 C20 60 28 45 30 35 C32 45 40 60 45 55 C50 50 40 40 30 30 Z"/><line x1="30" y1="25" x2="30" y2="35"/></svg>
        </div>
        <h1 class="site-title">TOP 登陆少年</h1>
        <p class="site-subtitle">陪你们纠缠到世界毁灭</p>
    </header>

    <nav class="nav-bar">
        <div class="nav-item">首页</div>
        <div class="nav-item">音乐</div>
        <div class="nav-item">相册</div>
        <div class="nav-item">行程</div>
        <div class="nav-item">应援</div>
    </nav>

    <div class="divider"></div>

    <!-- 成员区 -->
    <section class="section">
        <div class="section-header">
            <h2 class="section-title">五 人 画 像</h2>
        </div>
        <div class="members-grid">
            <div class="member-card">
                <div class="member-avatar">鑫</div>
                <div class="member-name">朱志鑫</div>
                <div class="member-role">黄色</div>
            </div>
            <div class="member-card">
                <div class="member-avatar">航</div>
                <div class="member-name">左航</div>
                <div class="member-role">蓝色</div>
            </div>
            <div class="member-card">
                <div class="member-avatar">皓</div>
                <div class="member-name">苏新皓</div>
                <div class="member-role">红色</div>
            </div>
            <div class="member-card">
                <div class="member-avatar">极</div>
                <div class="member-name">张极</div>
                <div class="member-role">橙色</div>
            </div>
            <div class="member-card">
                <div class="member-avatar">禹</div>
                <div class="member-name">张泽禹</div>
                <div class="member-role">绿色</div>
            </div>
        </div>
    </section>

    <div class="divider"></div>

    <!-- 占位模块 -->
    <section class="section">
        <div class="section-header">
            <h2 class="section-title">待 续 篇 章</h2>
        </div>
        <div class="modules-grid">
            <div class="module-card">
                <div class="module-icon">
                    <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20"/><circle cx="24" cy="24" r="8"/><line x1="24" y1="4" x2="24" y2="12"/><line x1="24" y1="36" x2="24" y2="44"/><line x1="4" y1="24" x2="12" y2="24"/><line x1="36" y1="24" x2="44" y2="24"/></svg>
                </div>
                <div class="module-title">音乐作品</div>
                <div class="module-desc">收录单曲、专辑与舞台音频，以手绘唱片封面的形式呈现每一次发声。</div>
                <div class="module-tag">建设中</div>
            </div>

    Array.from(text).forEach((char, i) => {
        const span = document.createElement('span');
        span.className = 'char';
        span.style.setProperty('--i', i);
        span.textContent = char;
        container.appendChild(span);
    });

    function enterMain() {
        document.getElementById('intro-page').classList.remove('active');
        document.getElementById('main-page').classList.add('active');
        window.scrollTo(0, 0);
